<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FocusOS" />
  <title>FocusOS — Abitudini, Calendario & Studio</title>
  <style>
    :root {
      --bg-primary: #F2F2F7;
      --bg-card: #FFFFFF;
      --bg-glass: rgba(255, 255, 255, 0.78);
      --text-primary: #1C1C1E;
      --text-secondary: #8E8E93;
      --separator: rgba(60, 60, 67, 0.12);
      --blue: #007AFF;
      --green: #34C759;
      --orange: #FF9500;
      --red: #FF3B30;
      --purple: #AF52DE;
      --teal: #5AC8FA;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #000000;
        --bg-card: #1C1C1E;
        --bg-glass: rgba(28, 28, 30, 0.82);
        --text-primary: #FFFFFF;
        --text-secondary: #98989D;
        --separator: rgba(255, 255, 255, 0.14);
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      padding-bottom: 105px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header iOS Style */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-glass);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--separator);
      padding: 16px 24px 12px;
    }

    .header-container {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.6px;
    }

    .date-label {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-secondary);
      letter-spacing: 0.4px;
    }

    main {
      max-width: 920px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .page {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Segmented Control iOS */
    .segmented-control {
      display: flex;
      background: rgba(118, 118, 128, 0.12);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 20px;
    }

    .segment-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .segment-btn.active {
      background: var(--bg-card);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    /* Card Component */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    /* Charts Grid */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 720px) {
      .charts-grid, .calendar-layout {
        grid-template-columns: 1fr !important;
      }
    }

    /* Ring Charts (Apple Fitness Style) */
    .rings-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 12px;
      padding: 8px 0;
    }

    .ring-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .ring-svg {
      width: 78px;
      height: 78px;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: var(--separator);
      stroke-width: 8;
    }

    .ring-progress {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ring-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .ring-value {
      font-size: 14px;
      font-weight: 700;
    }

    /* Bar Chart */
    .bar-chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 130px;
      padding-top: 16px;
      gap: 10px;
    }

    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      gap: 6px;
    }

    .bar-track {
      width: 100%;
      max-width: 28px;
      height: 100%;
      background: rgba(118, 118, 128, 0.1);
      border-radius: 8px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }

    .bar-fill {
      width: 100%;
      background: linear-gradient(180deg, var(--blue), var(--teal));
      border-radius: 8px;
      transition: height 0.4s ease;
    }

    .bar-day {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* Table with Checkboxes */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 520px;
    }

    th, td {
      padding: 12px 8px;
      text-align: center;
      border-bottom: 1px solid var(--separator);
    }

    th:first-child, td:first-child {
      text-align: left;
      padding-left: 4px;
      font-weight: 500;
      min-width: 170px;
    }

    th {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    /* Custom Apple Checkbox */
    .ios-check {
      appearance: none;
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      min-width: 24px;
      border-radius: 50%;
      border: 2px solid rgba(142, 142, 147, 0.45);
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ios-check:checked {
      background-color: var(--green);
      border-color: var(--green);
      transform: scale(1.05);
    }

    .ios-check:checked::after {
      content: "";
      width: 5px;
      height: 10px;
      border: solid white;
      border-width: 0 2.2px 2.2px 0;
      transform: rotate(45deg);
      margin-bottom: 2px;
    }

    .progress-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(0, 122, 255, 0.12);
      color: var(--blue);
      display: inline-block;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 15px;
      margin-left: 8px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    .delete-btn:hover {
      opacity: 1;
      color: var(--red);
    }

    /* Inputs & Buttons */
    .add-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .ios-input, .ios-select {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--separator);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
    }

    .ios-input {
      flex: 1;
      min-width: 180px;
    }

    .ios-input:focus, .ios-select:focus {
      border-color: var(--blue);
    }

    .ios-btn {
      background: var(--blue);
      color: #FFF;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .ios-btn:active {
      transform: scale(0.97);
    }

    .ios-btn.secondary {
      background: rgba(118, 118, 128, 0.16);
      color: var(--text-primary);
    }

    .ios-btn.small {
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 8px;
    }

    /* --- PAGINA CALENDARIO & SCADENZE --- */
    .calendar-layout {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 18px;
      align-items: start;
    }

    .cal-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cal-nav-btn {
      background: rgba(118, 118, 128, 0.12);
      border: none;
      color: var(--blue);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--separator);
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .cal-day {
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      position: relative;
      transition: background 0.15s ease, transform 0.1s ease;
      user-select: none;
    }

    .cal-day:hover {
      background: rgba(118, 118, 128, 0.1);
    }

    .cal-day.empty {
      cursor: default;
      pointer-events: none;
    }

    .cal-day.today {
      color: var(--red);
      font-weight: 700;
    }

    .cal-day.selected {
      background: var(--blue);
      color: #FFFFFF !important;
      font-weight: 700;
      box-shadow: 0 3px 10px rgba(0, 122, 255, 0.3);
    }

    .cal-dots {
      display: flex;
      gap: 3px;
      margin-top: 3px;
      height: 5px;
    }

    .cal-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    .cal-day.selected .cal-dot {
      background: #FFFFFF !important;
    }

    /* Lista Eventi & Scadenze */
    .event-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .event-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--bg-primary);
      border-radius: var(--radius-md);
      border-left: 4px solid var(--blue);
      gap: 10px;
    }

    .event-item.type-scadenza {
      border-left-color: var(--red);
    }

    .event-item.type-esame {
      border-left-color: var(--purple);
    }

    .event-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .event-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .event-title {
      font-size: 15px;
      font-weight: 600;
    }

    .event-title.done {
      text-decoration: line-through;
      color: var(--text-secondary);
    }

    .event-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.3px;
    }

    .badge.impegno {
      background: rgba(0, 122, 255, 0.14);
      color: var(--blue);
    }

    .badge.scadenza {
      background: rgba(255, 59, 48, 0.14);
      color: var(--red);
    }

    .badge.esame {
      background: rgba(175, 82, 222, 0.14);
      color: var(--purple);
    }

    .empty-state {
      text-align: center;
      padding: 24px 12px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* STUDIO - POMODORO PAGE */
    .pomodoro-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 16px 0;
    }

    .timer-ring-box {
      position: relative;
      width: 270px;
      height: 270px;
      margin: 16px 0 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .timer-circle-bg {
      fill: none;
      stroke: var(--separator);
      stroke-width: 10;
    }

    .timer-circle-prog {
      fill: none;
      stroke: var(--orange);
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s linear, stroke 0.3s ease;
    }

    .timer-display {
      z-index: 2;
    }

    .timer-digits {
      font-size: 56px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1.5px;
    }

    .timer-status {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .timer-controls {
      display: flex;
      gap: 14px;
      margin-bottom: 24px;
    }

    .timer-controls .ios-btn {
      min-width: 120px;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 14px;
    }

    .pomodoro-settings {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 460px;
      margin-top: 10px;
    }

    .setting-box {
      background: var(--bg-primary);
      padding: 12px;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .setting-box label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .setting-box input {
      width: 64px;
      text-align: center;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid var(--separator);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
    }

    /* Bottom Navigation Bar (Apple Tab Bar) */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 78px;
      background: var(--bg-glass);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--separator);
      display: flex;
      justify-content: center;
      gap: 48px;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
    }

    .tab-item {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: color 0.2s ease, transform 0.15s ease;
      min-width: 64px;
    }

    .tab-item svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .tab-item.active {
      color: var(--blue);
    }

    .tab-item:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header>
    <div class="header-container">
      <div>
        <div class="date-label" id="currentDateLabel">OGGI</div>
        <h1 id="pageTitle">Obiettivi & Abitudini</h1>
      </div>
    </div>
  </header>

  <main>
    <!-- PAGINA 1: ABITUDINI E OBIETTIVI -->
    <section id="page-habits" class="page active">
      <div class="segmented-control">
        <button class="segment-btn active" onclick="switchPeriod('daily', this)">Giorno (Lun-Dom)</button>
        <button class="segment-btn" onclick="switchPeriod('weekly', this)">Settimana (1-4)</button>
        <button class="segment-btn" onclick="switchPeriod('monthly', this)">Mese (Obiettivi)</button>
      </div>

      <div class="charts-grid">
        <div class="card" style="margin-bottom: 0;">
          <div class="card-header">
            <span class="card-title">Riepilogo Totale</span>
          </div>
          <div class="rings-wrapper">
            <div class="ring-item">
              <svg class="ring-svg" viewBox="0 0 80 80">
                <circle class="ring-bg" cx="40" cy="40" r="32"></circle>
                <circle id="ring-daily" class="ring-progress" stroke="var(--red)" cx="40" cy="40" r="32" stroke-dasharray="201" stroke-dashoffset="201"></circle>
              </svg>
              <span class="ring-value" id="ring-daily-val">0%</span>
              <span class="ring-label">Giorno</span>
            </div>
            <div class="ring-item">
              <svg class="ring-svg" viewBox="0 0 80 80">
                <circle class="ring-bg" cx="40" cy="40" r="32"></circle>
                <circle id="ring-weekly" class="ring-progress" stroke="var(--green)" cx="40" cy="40" r="32" stroke-dasharray="201" stroke-dashoffset="201"></circle>
              </svg>
              <span class="ring-value" id="ring-weekly-val">0%</span>
              <span class="ring-label">Settimana</span>
            </div>
            <div class="ring-item">
              <svg class="ring-svg" viewBox="0 0 80 80">
                <circle class="ring-bg" cx="40" cy="40" r="32"></circle>
                <circle id="ring-monthly" class="ring-progress" stroke="var(--blue)" cx="40" cy="40" r="32" stroke-dasharray="201" stroke-dashoffset="201"></circle>
              </svg>
              <span class="ring-value" id="ring-monthly-val">0%</span>
              <span class="ring-label">Mese</span>
            </div>
          </div>
        </div>

        <div class="card" style="margin-bottom: 0;">
          <div class="card-header">
            <span class="card-title" id="barChartTitle">Andamento Giornaliero</span>
          </div>
          <div class="bar-chart" id="barChartContainer"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title" id="tableTitle">Tracciamento Giornaliero</span>
        </div>
        <div class="table-wrapper">
          <table id="habitsTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <div class="add-row">
          <input type="text" id="newHabitInput" class="ios-input" placeholder="Aggiungi nuova abitudine o obiettivo..." onkeydown="if(event.key==='Enter') addHabit()" />
          <button class="ios-btn" onclick="addHabit()">+ Aggiungi</button>
        </div>
      </div>
    </section>

    <!-- PAGINA 2: CALENDARIO, IMPEGNI & SCADENZE -->
    <section id="page-calendar" class="page">
      <div class="calendar-layout">
        <!-- Colonna Sinistra: Griglia Mese -->
        <div class="card">
          <div class="card-header">
            <span class="card-title" id="calMonthYear">Mese Anno</span>
            <div class="cal-nav">
              <button class="ios-btn secondary small" onclick="goToToday()">Oggi</button>
              <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
              <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
            </div>
          </div>

          <div class="cal-weekdays">
            <div>LUN</div><div>MAR</div><div>MER</div><div>GIO</div><div>VEN</div><div>SAB</div><div>DOM</div>
          </div>
          <div class="cal-grid" id="calendarGrid"></div>
        </div>

        <!-- Colonna Destra: Eventi del Giorno Selezionato -->
        <div>
          <div class="card">
            <div class="card-header">
              <span class="card-title" id="selectedDayTitle">Impegni del Giorno</span>
            </div>

            <div id="dayEventsList" class="event-list"></div>

            <!-- Form Aggiungi Impegno / Scadenza -->
            <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--separator);">
              <div style="font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px;">
                NUOVO IMPEGNO O SCADENZA
              </div>
              <div class="add-row" style="margin-top: 0;">
                <input type="text" id="eventTitleInput" class="ios-input" placeholder="Es. Consegna progetto, Esame..." onkeydown="if(event.key==='Enter') addCalendarEvent()" />
              </div>
              <div class="add-row" style="margin-top: 10px;">
                <input type="time" id="eventTimeInput" class="ios-select" style="flex: 1;" />
                <select id="eventTypeInput" class="ios-select" style="flex: 1.4;">
                  <option value="impegno">🔵 Impegno</option>
                  <option value="scadenza">🔴 Scadenza</option>
                  <option value="esame">🟣 Esame / Studio</option>
                </select>
                <button class="ios-btn" onclick="addCalendarEvent()">+ Aggiungi</button>
              </div>
            </div>
          </div>

          <!-- Card Riepilogo Prossime Scadenze -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">Prossime Scadenze & Impegni</span>
            </div>
            <div id="upcomingEventsList" class="event-list"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- PAGINA 3: STUDIO (POMODORO) -->
    <section id="page-studio" class="page">
      <div class="card">
        <div class="segmented-control">
          <button class="segment-btn active" id="mode-work" onclick="setPomodoroMode('work')">Studio</button>
          <button class="segment-btn" id="mode-short" onclick="setPomodoroMode('short')">Pausa Breve</button>
          <button class="segment-btn" id="mode-long" onclick="setPomodoroMode('long')">Pausa Lunga</button>

        <div class="pomodoro-container">
          <div class="timer-ring-box">
            <svg class="timer-svg" viewBox="0 0 260 260">

              <circle id="timerRing" class="timer-circle-prog" cx="130" cy="130" r="116" stroke-dasharray="728.8" stroke-dashoffset="0"></circle>

            <div class="timer-display">
              <div class="timer-digits" id="timerDigits">25:00</div>

          <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 16px;">
            Pomodori completati oggi: <strong id="pomodoroCount" style="color: var(--text-primary);">0</strong> 🍅
          </p>

          <div class="pomodoro-settings">
            <div class="setting-box">
              <label>Studio (min)</label>
              <input type="number" id="inputWork" value="25" min="1" max="120" onchange="updateDurations()" />
            </div>
            <div class="setting-box">
              <label>Pausa Breve</label>
              <input type="number" id="inputShort" value="5" min="1" max="60" onchange="updateDurations()" />
            </div>
            <div class="setting-box">
              <label>Pausa Lunga</label>
              <input type="number" id="inputLong" value="15" min="1" max="60" onchange="updateDurations()" />
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- BARRA IN BASSO (TAB BAR A 3 SEZIONI) -->

  <script>
    // --- HELPER DATE ---
    function toISODate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    const todayDate = new Date();
    const todayISO = toISODate(todayDate);

    // --- STATO INIZIALE & SALVATAGGIO ---
    const defaultData = {
      daily: {
        columns: ["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"],
        items: [
          { name: "Studiare 2 ore", checks: [true, true, false, true, false, false, false] },
          { name: "Allenamento / Camminata", checks: [true, false, true, true, false, false, false] },
          { name: "Lettura 20 pagine", checks: [true, true, true, false, false, false, false] },
          { name: "Bere 2L d'acqua", checks: [true, true, true, true, false, false, false] }
        ]
      },
      weekly: {
        columns: ["Sett. 1", "Sett. 2", "Sett. 3", "Sett. 4"],
        items: [
          { name: "Ripasso generale esami", checks: [true, true, false, false] },
          { name: "3 sessioni di sport completate", checks: [true, false, false, false] },
          { name: "Pianificazione spesa e budget", checks: [true, true, false, false] }
        ]
      },
      monthly: {
        columns: ["Stato Mese"],
        items: [
          { name: "Finire libro del mese", checks: [false] },
          { name: "Consegnare progetto universitario", checks: [true] },
          { name: "Risparmiare obiettivo mensile", checks: [true] }
        ]
      },
      events: {
        [todayISO]: [
          { id: 1, title: "Sessione di studio intensiva", time: "15:00", type: "esame", done: false },
          { id: 2, title: "Consegna report settimanale", time: "18:30", type: "scadenza", done: false }
        ]
      },
      pomodorosCompleted: 0
    };

    let appData = JSON.parse(localStorage.getItem("focusOS_v2_data")) || defaultData;
    if (!appData.events) appData.events = {};

    let currentPeriod = "daily";

    function saveData() {
      localStorage.setItem("focusOS_v2_data", JSON.stringify(appData));
    }

    // --- IMPOSTAZIONE DATA HEADER ---
    const headerDateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
    document.getElementById("currentDateLabel").textContent = todayDate.toLocaleDateString('it-IT', headerDateOptions);

    // --- NAVIGAZIONE TAB BAR ---
    function switchTab(tab, btn) {
      document.querySelectorAll(".tab-item").forEach(el => el.classList.remove("active"));
      btn.classList.add("active");

      document.querySelectorAll(".page").forEach(el => el.classList.remove("active"));
      if (tab === "habits") {
        document.getElementById("page-habits").classList.add("active");
        document.getElementById("pageTitle").textContent = "Obiettivi & Abitudini";
      } else if (tab === "calendar") {
        document.getElementById("page-calendar").classList.add("active");
        document.getElementById("pageTitle").textContent = "Calendario & Scadenze";
        renderCalendarAll();
      } else {
        document.getElementById("page-studio").classList.add("active");
        document.getElementById("pageTitle").textContent = "Studio & Pomodoro";
      }
    }

    // --- LOGICA ABITUDINI & GRAFICI ---
    function switchPeriod(period, btn) {
      currentPeriod = period;
      document.querySelectorAll("#page-habits .segment-btn").forEach(el => el.classList.remove("active"));
      btn.classList.add("active");

      const titles = {
        daily: "Tracciamento Giornaliero (Settimana Corrente)",
        weekly: "Obiettivi Settimanali del Mese",
        monthly: "Traguardi Mensili"
      };
      const chartTitles = {
        daily: "Andamento Giornaliero (Lun-Dom)",
        weekly: "Andamento Settimanale (Sett 1-4)",
        monthly: "Completamento Obiettivi Mensili"
      };

      document.getElementById("tableTitle").textContent = titles[period];
      document.getElementById("barChartTitle").textContent = chartTitles[period];
      renderAll();
    }

    function renderAll() {
      renderTable();
      renderRings();
      renderBarChart();
      document.getElementById("pomodoroCount").textContent = appData.pomodorosCompleted || 0;
    }

    function renderTable() {
      const section = appData[currentPeriod];
      const thead = document.getElementById("tableHead");
      const tbody = document.getElementById("tableBody");

      let headHTML = `<tr><th>Abitudine / Obiettivo</th>
